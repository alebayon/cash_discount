name: 'cash_discount'
version: '1.0.0'
config-version: 2

profile: 'cash_discount'

vars:
  reporting_period_start: '2024-01-01'
  reporting_period_end: '2024-12-31'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  cash_discount:
    src:
      +materialized: view
    int:
      +materialized: ephemeral
    dim:
      +materialized: table
    fct:
      +materialized: table
    map:
      +materialized: table
    mart:
      +materialized: table