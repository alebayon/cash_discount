version: 2

models:
  - name: fct_inv_sap
    description: >
      SAP vendor invoice fact. One row per posted vendor invoice (KR).
      Grain sap_inv_key. Structural is_entitled is period-agnostic;
      is_kpi_entitled applies the reporting-period paid gate (dbt vars).
    columns:
      - name: sap_inv_key
        description: Composite business key (BELNR-BUKRS-GJAHR).
        tests:
          - unique
          - not_null
      - name: vendor_id
        description: SAP vendor account number. FK to dim_vendor_sap.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendor_sap')
                field: vendor_id
      - name: clearing_date
        description: SAP clearing date (AUGDT). Null when invoice is open/uncleared.
      - name: discount_taken_amount
        description: >
          SAP cash discount amount posted at clearing (SKNTO). Null when open/uncleared;
          0 when cleared with no discount taken.
      - name: discount_pct
        description: Cash discount percentage from payment terms seed (e.g. 0.02 for Z210).
      - name: discount_deadline_date
        description: Last date of discount window (baseline_date + discount_days from seed).
      - name: discount_opportunity_amount
        description: >
          Maximum discount available on structurally entitled rows
          (invoice_amount × discount_pct).
        tests:
          - not_null:
              config:
                where: "is_entitled"        
      - name: is_entitled
        description: >
          P1 structural entitlement (pre-payment gate). True when all entitlement
          checks pass regardless of clearing status or reporting period.
        tests:
          - not_null
      - name: not_entitled_reason
        description: First failing P1 entitlement rule; null when is_entitled is true.
      - name: is_cleared
        description: True when clearing_date is not null (invoice has been paid/cleared).
        tests:
          - not_null
      - name: is_paid_in_period
        description: >
          True when cleared and clearing_date falls within reporting_period_start
          and reporting_period_end (dbt_project.yml vars).
        tests:
          - not_null
      - name: is_kpi_entitled
        description: >
          KPI funnel ENT node. is_entitled AND is_paid_in_period for the
          configured reporting period.
        tests:
          - not_null
      - name: is_taken
        description: >
          KPI funnel TAKEN node. True when is_kpi_entitled and discount_taken_amount
          equals discount_opportunity_amount (> 0). False on other KPI entitled rows;
          null when not is_kpi_entitled.
        tests:
          - not_null:
              config:
                where: "is_kpi_entitled"
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_kpi_entitled"
      - name: payment_block_at_clearing
        description: >
          Point-in-time snapshot at clearing. True when invoice/vendor had an
          explicit payment block at clearing_date. Null when open/uncleared.
        tests:
          - not_null:
              config:
                where: "is_cleared"

      - name: dispute_open_at_clearing
        description: >
          Point-in-time snapshot at clearing. True when an invoice dispute was
          open at clearing_date. Null when open/uncleared.
        tests:
          - not_null:
              config:
                where: "is_cleared"

      - name: match_or_gr_block_at_clearing
        description: >
          Point-in-time snapshot at clearing. True when three-way match or GR
          was incomplete at clearing_date. Null when open/uncleared.
        tests:
          - not_null:
              config:
                where: "is_cleared"

      - name: do_not_take_skonto_at_clearing
        description: >
          Point-in-time snapshot at clearing. True when payment was explicitly
          instructed not to take Skonto at clearing_date. Null when open/uncleared.
        tests:
          - not_null:
              config:
                where: "is_cleared"
      - name: sap_ref_key
        description: >
          Coupa invoice id stamped on SAP at posting (BKPF XREF2_HD).
          Populated by integration for Coupa-posted documents; null on
          SAP-only paths (e.g. FB60). Used to build map_inv_sap_coupa;
          not an FK.                

      - name: is_excluded
        description: >
          KPI funnel EXCLUDED node. True when is_kpi_entitled, not is_taken,
          and any exclusion snapshot flag is true at clearing. False on other
          eligible rows; null when not is_kpi_entitled or is_taken.
        tests:
          - not_null:
              config:
                where: "is_kpi_entitled and not is_taken"
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_kpi_entitled and not is_taken"
      - name: is_leakage
        description: >
          KPI funnel LEAKAGE node. True when is_kpi_entitled, not is_taken,
          and not is_excluded. False on other eligible rows; null when not
          is_kpi_entitled or is_taken.
        tests:
          - not_null:
              config:
                where: "is_kpi_entitled and not is_taken"
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_kpi_entitled and not is_taken"

      - name: lost_discount_amount
        description: >
          Discount not captured on leakage rows
          (discount_opportunity_amount - discount_taken_amount).
          Null when not is_leakage.
        tests:
          - not_null:
              config:
                where: "is_leakage"

      - name: primary_cause
        description: >
          Root-cause category on leakage rows only. timing = paid after
          discount_deadline_date; capture = paid in window but discount not
          taken; structural = fallback when dates cannot classify.
        tests:
          - not_null:
              config:
                where: "is_leakage"
          - accepted_values:
              arguments:
                values: ['timing', 'capture', 'structural']
              config:
                where: "is_leakage"

  - name: fct_inv_coupa
    description: >
      Slim Coupa invoice fact. One row per in-scope invoice (document_type = Invoice).
      No KPI funnel; period scoping lives on fct_inv_sap. Grain coupa_id.
    columns:
      - name: coupa_id
        description: Coupa invoice system id.
        tests:
          - unique
          - not_null
      - name: vendor_id
        description: Coupa supplier id. FK to dim_vendor_coupa.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendor_coupa')
                field: vendor_id
      - name: invoice_number
        description: Supplier invoice reference for human validation and map checks.
        tests:
          - not_null
      - name: status
        description: Coupa workflow state (not used for SAP KPI buckets).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'approved', 'disputed', 'voided']
      - name: invoice_date
        description: Invoice date from Coupa (process timeline anchor).
        tests:
          - not_null
      - name: created_at
        description: Coupa record created timestamp.
        tests:
          - not_null
      - name: updated_at
        description: Coupa record last updated timestamp.
        tests:
          - not_null
      - name: paid
        description: Coupa paid flag; optional reconciliation vs SAP clearing.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: payment_date
        description: Coupa payment date when paid; null on unpaid rows.