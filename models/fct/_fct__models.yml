version: 2

models:

  - name: fct_inv_sap_core
    description: >
      Shared SAP vendor invoice spine (ap_core). One row per in-scope KR invoice.
      Grain sap_inv_key. Durable facts, terms, map-based Coupa fields, and neutral
      elapsed days only — no CD KPI or reporting-period fields.
    columns:
      - name: sap_inv_key
        description: Composite business key (BELNR-BUKRS-GJAHR).
        tests:
          - unique
          - not_null
      - name: net_due_date
        description: Contractual net due date (baseline_date + net_days from payment terms seed).
      - name: coupa_posting_ref
        description: >
          SAP posting reference to Coupa (XREF2_HD). Matching input; confirmed
          cross-system link is map_inv_sap_coupa.
      - name: coupa_id
        description: Coupa invoice id from map_inv_sap_coupa when a confirmed match exists.
      - name: receipt_date
        description: Mapped Coupa receipt anchor (created_at date) when coupa_id is present.

  - name: fct_inv_sap_cd
    description: >
      Cash discount SAP invoice fact (canonical). One row per posted vendor invoice (KR).
      Grain sap_inv_key. Built on fct_inv_sap_core. Structural is_entitled is period-agnostic;
      is_kpi_entitled applies the reporting-period paid gate (dbt vars).
      Version 6 leakage root-cause waterfall and policy fields (D83–D90).
      Legacy ref fct_inv_sap is a deprecated shim to this model.
    columns:
      - name: sap_inv_key
        description: Composite business key (BELNR-BUKRS-GJAHR).
        tests:
          - unique
          - not_null
      - name: vendor_id
        description: SAP vendor account number. FK to dim_vendor_sap.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendor_sap')
                field: vendor_id
      - name: sap_entry_date
        description: >
          SAP document entry date (BKPF CPUDT). Authoritative pre-SAP/payment
          handoff milestone for Version 6 attribution and timing regime (D84).
        tests:
          - not_null
      - name: clearing_date
        description: SAP clearing date (AUGDT). Null when invoice is open/uncleared.
      - name: discount_taken_amount
        description: >
          SAP cash discount amount posted at clearing (SKNTO). Null when open/uncleared;
          0 when cleared with no discount taken.
      - name: discount_pct
        description: Cash discount percentage from payment terms seed (e.g. 0.02 for Z210).
      - name: discount_deadline_date
        description: Last date of discount window (baseline_date + discount_days from seed).
      - name: discount_opportunity_amount
        description: >
          Maximum discount available on structurally entitled rows
          (invoice_amount × discount_pct).
        tests:
          - not_null:
              config:
                where: "is_entitled"
      - name: is_entitled
        description: >
          P1 structural entitlement (pre-payment gate). True when all entitlement
          checks pass regardless of clearing status or reporting period.
        tests:
          - not_null
      - name: not_entitled_reason
        description: First failing P1 entitlement rule; null when is_entitled is true.
      - name: is_cleared
        description: True when clearing_date is not null (invoice has been paid/cleared).
        tests:
          - not_null
      - name: is_paid_in_period
        description: >
          True when cleared and clearing_date falls within reporting_period_start
          and reporting_period_end (dbt_project.yml vars).
        tests:
          - not_null
      - name: is_kpi_entitled
        description: >
          KPI funnel ENT node. is_entitled AND is_paid_in_period for the
          configured reporting period.
        tests:
          - not_null
      - name: is_taken
        description: >
          KPI funnel TAKEN node. True when is_kpi_entitled and discount_taken_amount
          equals discount_opportunity_amount (> 0). False on other KPI entitled rows;
          null when not is_kpi_entitled.
        tests:
          - not_null:
              config:
                where: "is_kpi_entitled"
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_kpi_entitled"
      - name: do_not_take_skonto_at_clearing
        description: >
          Point-in-time snapshot at clearing (NOSKNT_CLR). Sole driver of
          is_excluded on KPI-eligible not-taken rows (D91). Null when open/uncleared.
        tests:
          - not_null:
              config:
                where: "is_cleared"
      - name: sap_ref_key
        description: >
          Coupa invoice id stamped on SAP at posting (BKPF XREF2_HD).
          Populated by integration for Coupa-posted documents; null on
          SAP-only paths (e.g. FB60). Used to build map_inv_sap_coupa;
          not an FK.

      - name: is_excluded
        description: >
          KPI funnel EXCLUDED node. True when is_kpi_entitled, not is_taken,
          and do_not_take_skonto_at_clearing is true (D91). False on other
          eligible rows; null when not is_kpi_entitled or is_taken.
        tests:
          - not_null:
              config:
                where: "is_kpi_entitled and not is_taken"
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_kpi_entitled and not is_taken"
      - name: is_leakage
        description: >
          KPI funnel LEAKAGE node. True when is_kpi_entitled, not is_taken,
          and not is_excluded. False on other eligible rows; null when not
          is_kpi_entitled or is_taken.
        tests:
          - not_null:
              config:
                where: "is_kpi_entitled and not is_taken"
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_kpi_entitled and not is_taken"

      - name: lost_discount_amount
        description: >
          Discount not captured on leakage rows
          (discount_opportunity_amount - discount_taken_amount).
          Null when not is_leakage.
        tests:
          - not_null:
              config:
                where: "is_leakage"

      - name: receipt_date
        description: >
          Intake anchor (Coupa created_at::date). Null on SAP-only rows;
          null receipt on leakage → data_quality_error (D87).

      - name: attribution_policy_version
        description: Active leakage attribution policy label from seed_attribution_policy (D83/D90).
        tests:
          - not_null

      - name: minimum_processing_days
        description: Expedited minimum pre-SAP calendar days from active policy.
        tests:
          - not_null

      - name: standard_processing_days
        description: Standard pre-SAP calendar days from active policy.
        tests:
          - not_null

      - name: minimum_payment_runway_days
        description: Required payment runway at SAP handoff from active policy.
        tests:
          - not_null

      - name: available_days
        description: Calendar days receipt_date to discount_deadline_date (D85).

      - name: processing_available_days
        description: Pre-SAP budget after payment runway reserve (D85).

      - name: pre_sap_elapsed_days
        description: Calendar days receipt_date to sap_entry_date (D85).

      - name: runway_at_handoff
        description: Calendar days sap_entry_date to discount_deadline_date (D85).

      - name: latest_safe_sap_entry_date
        description: Last SAP entry date preserving minimum payment runway (D85).

      - name: standard_sap_target_date
        description: receipt_date plus standard_processing_days (D85).

      - name: operational_sap_due_date
        description: Least of standard SAP target and latest safe handoff (D85).

      - name: deadline_miss_days
        description: Calendar days discount_deadline_date to clearing_date when cleared (D85).

      - name: handoff_reserve_shortfall_days
        description: Days short of minimum payment runway at handoff (D85).

      - name: actual_cycle_days
        description: Calendar days receipt_date to clearing_date when both present.

      - name: terms_condition
        description: Contractual terms severity diagnostic (D86/D88).
        tests:
          - accepted_values:
              arguments:
                values:
                  - terms_below_minimum
                  - terms_below_standard
                  - terms_standard
              config:
                where: "is_leakage and discount_days is not null"

      - name: intake_condition
        description: Intake band diagnostic from processing_available_days (D88).
        tests:
          - accepted_values:
              arguments:
                values: [insufficient, compressed, standard]
              config:
                where: "is_leakage and processing_available_days is not null"

      - name: handoff_condition
        description: Payment reserve diagnostic at SAP handoff (D88).
        tests:
          - accepted_values:
              arguments:
                values: [reserve_not_met, reserve_met]
              config:
                where: "is_leakage and runway_at_handoff is not null"

      - name: pre_sap_exceeded_standard
        description: True when pre_sap_elapsed_days exceeds standard_processing_days (D88).

      - name: primary_cause
        description: >
          Version 6 root-cause on leakage rows only (ordered waterfall D87).
        tests:
          - not_null:
              config:
                where: "is_leakage"
          - accepted_values:
              arguments:
                values:
                  - data_quality_error
                  - capture
                  - structural_terms_vs_capability
                  - structural_insufficient_time_at_intake
                  - pre_sap_execution_compressed
                  - pre_sap_execution_standard
                  - payment_execution
              config:
                where: "is_leakage"

      - name: primary_cause_group
        description: >
          Broad roll-up of primary_cause on leakage rows.
          structural_* → structural; execution causes → timing.
        tests:
          - not_null:
              config:
                where: "is_leakage"
          - accepted_values:
              arguments:
                values: ['capture', 'structural', 'timing', 'unclassified']
              config:
                where: "is_leakage"

      - name: primary_owner
        description: Process owner for primary_cause on leakage rows (D87).
        tests:
          - not_null:
              config:
                where: "is_leakage"
          - accepted_values:
              arguments:
                values:
                  - unclassified
                  - capture_process
                  - procurement_contracts
                  - upstream_intake
                  - pre_sap
                  - payment
              config:
                where: "is_leakage"

      - name: is_still_feasible
        description: >
          Leakage rows only. True when processing_available_days >= minimum_processing_days.
          Null on capture and data_quality_error.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_leakage and primary_cause not in ('capture', 'data_quality_error')"

      - name: requires_expedited_processing
        description: >
          Leakage rows only. True when minimum <= processing_available_days < standard.
          Null on capture and data_quality_error.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_leakage and primary_cause not in ('capture', 'data_quality_error')"

      - name: is_timing_contributor
        description: >
          Leakage rows only. Missed deadline with pre-SAP overrun or payment_execution.
          Null on capture and data_quality_error.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_leakage and primary_cause not in ('capture', 'data_quality_error')"

  - name: fct_inv_coupa
    description: >
      Slim Coupa invoice fact. One row per in-scope invoice (document_type = Invoice).
      No KPI funnel; period scoping lives on fct_inv_sap. Grain coupa_id.
    columns:
      - name: coupa_id
        description: Coupa invoice system id.
        tests:
          - unique
          - not_null
      - name: vendor_id
        description: Coupa supplier id. FK to dim_vendor_coupa.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendor_coupa')
                field: vendor_id
      - name: invoice_number
        description: Supplier invoice reference for human validation and map checks.
        tests:
          - not_null
      - name: status
        description: Coupa workflow state (not used for SAP KPI buckets).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'approved', 'disputed', 'voided']
      - name: invoice_date
        description: Invoice date from Coupa (process timeline anchor).
        tests:
          - not_null
      - name: created_at
        description: Coupa record created timestamp.
        tests:
          - not_null
      - name: updated_at
        description: Coupa record last updated timestamp.
        tests:
          - not_null
      - name: paid
        description: Coupa paid flag; optional reconciliation vs SAP clearing.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: payment_date
        description: Coupa payment date when paid; null on unpaid rows.

  - name: fct_inv_timing_span
    description: >
      Process phase spans per invoice. Ownership branch reads fct_inv_sap only
      (pre_sap, payment). Subprocess branch reads fct_inv_coupa_changes plus SAP
      dates (intake, verification, approval, interface, payment). Does not
      recompute leakage or Version 6 attribution. Population is all invoices.
    columns:
      - name: sap_inv_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_inv_sap')
                field: sap_inv_key
      - name: phase_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ownership', 'subprocess']
      - name: phase_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pre_sap', 'payment', 'intake', 'verification', 'approval', 'interface']
      - name: span_seq
        tests:
          - not_null
      - name: span_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['measured', 'not_applicable', 'not_ended', 'not_measurable']
      - name: start_event_id
        description: >
          Coupa change id at subprocess span start (drill-through). Null on
          ownership rows and SAP-milestone boundaries.
      - name: end_event_id
        description: >
          Coupa change id at subprocess span end. Null on ownership rows,
          interface end (CPUDT), and payment spans.

  - name: fct_inv_coupa_changes
    description: >
      Coupa invoice revision events. One row per status change. Grain
      coupa_change_id. status_role from seed_coupa_status_map drives subprocess
      span boundaries (D21).
    columns:
      - name: coupa_change_id
        description: Coupa invoice revision system id.
        tests:
          - unique
          - not_null
      - name: coupa_id
        description: Parent Coupa invoice id. FK to fct_inv_coupa.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_inv_coupa')
                field: coupa_id
      - name: status
        description: Raw Coupa workflow status on this revision.
        tests:
          - not_null
      - name: status_role
        description: Timing vocabulary role from seed_coupa_status_map (D21).
        tests:
          - not_null
      - name: role_kind
        description: boundary (drives spans) or informational (ignored by span state machine).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['boundary', 'informational']
      - name: event_at
        description: Event timestamp from Coupa created-at.
        tests:
          - not_null
      - name: event_date
        description: Date-only event date for span math (D24).
        tests:
          - not_null
      - name: revision_seq
        description: Tie-break when multiple events share event_date (D24).
        tests:
          - not_null

  - name: fct_inv_sap_changes
    description: >
      SAP invoice change events (phase 1). One row per change document.
      Grain sap_change_id. ZLSPR set/release via seed_sap_payment_block_map (D62).
    columns:
      - name: sap_change_id
        tests:
          - unique
          - not_null
      - name: sap_inv_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_inv_sap')
                field: sap_inv_key
      - name: block_event_role
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['set', 'release']
      - name: event_date
        tests:
          - not_null

  - name: fct_inv_timing_overlay_core
    description: >
      Observed blocker overlay intervals per invoice (ap_core). Grain
      (sap_inv_key, overlay_reason_code, interval_seq). Coupa on_hold, rework,
      and inv_dispute from int_inv_coupa_overlay_intervals; SAP payment_block
      from int_inv_sap_payment_block_intervals. No payment_run_wait (CD-only).
    columns:
      - name: sap_inv_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_inv_sap_core')
                field: sap_inv_key
      - name: overlay_reason_code
        tests:
          - not_null
      - name: interval_seq
        tests:
          - not_null
      - name: interval_start_date
        tests:
          - not_null
      - name: interval_end_date
        tests:
          - not_null
      - name: interval_days
        tests:
          - not_null
      - name: reason_group
        tests:
          - not_null
      - name: source_system
        tests:
          - not_null
      - name: source_change_id
        description: Coupa or SAP change anchor for drill-through (D40/D60).
        tests:
          - relationships:
              arguments:
                to: ref('fct_inv_coupa_changes')
                field: coupa_change_id
              config:
                where: "source_change_id is not null and source_system = 'coupa'"
          - relationships:
              arguments:
                to: ref('fct_inv_sap_changes')
                field: sap_change_id
              config:
                where: "source_change_id is not null and source_system = 'sap'"

  - name: fct_inv_timing_overlay_cd
    description: >
      Cash discount blocker overlay intervals (canonical). Grain
      (sap_inv_key, overlay_reason_code, interval_seq). Observed intervals from
      fct_inv_timing_overlay_core plus payment_run_wait derived for
      payment_execution leakage rows (D64/D75/D89). Legacy fct_inv_timing_overlay
      should shim to this model.
    columns:
      - name: sap_inv_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_inv_sap_cd')
                field: sap_inv_key
      - name: overlay_reason_code
        tests:
          - not_null
      - name: interval_seq
        tests:
          - not_null
      - name: interval_start_date
        tests:
          - not_null
      - name: interval_end_date
        tests:
          - not_null
      - name: interval_days
        tests:
          - not_null
      - name: reason_group
        tests:
          - not_null
      - name: source_system
        tests:
          - not_null
      - name: source_change_id
        description: Coupa or SAP change anchor for drill-through (D40/D60).
        tests:
          - relationships:
              arguments:
                to: ref('fct_inv_coupa_changes')
                field: coupa_change_id
              config:
                where: "source_change_id is not null and source_system = 'coupa'"
          - relationships:
              arguments:
                to: ref('fct_inv_sap_changes')
                field: sap_change_id
              config:
                where: "source_change_id is not null and source_system = 'sap'"


  - name: fct_inv_timing_overlay
    description: >
      Blocker overlay intervals per invoice. Grain
      (sap_inv_key, overlay_reason_code, interval_seq). Coupa on_hold, rework,
      and inv_dispute from int_inv_coupa_overlay_intervals; SAP payment_block
      from int_inv_sap_payment_block_intervals; payment_run_wait derived for
      payment_execution rows with runway at handoff (D64/D75/D89).
    columns:
      - name: sap_inv_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_inv_sap')
                field: sap_inv_key
      - name: overlay_reason_code
        tests:
          - not_null
      - name: interval_seq
        tests:
          - not_null
      - name: interval_start_date
        tests:
          - not_null
      - name: interval_end_date
        tests:
          - not_null
      - name: interval_days
        tests:
          - not_null
      - name: reason_group
        tests:
          - not_null
      - name: source_system
        tests:
          - not_null
      - name: source_change_id
        description: Coupa or SAP change anchor for drill-through (D40/D60).
        tests:
          - relationships:
              arguments:
                to: ref('fct_inv_coupa_changes')
                field: coupa_change_id
              config:
                where: "source_change_id is not null and source_system = 'coupa'"
          - relationships:
              arguments:
                to: ref('fct_inv_sap_changes')
                field: sap_change_id
              config:
                where: "source_change_id is not null and source_system = 'sap'"

  - name: fct_inv_timing_overlay_span
    description: >
      Bridge view joining overlay intervals to measured timing spans by date
      overlap. Derives reason_exposure_days per overlay x phase row (D32/D35).
    columns:
      - name: sap_inv_key
        tests:
          - not_null
      - name: overlay_reason_code
        tests:
          - not_null
      - name: interval_seq
        tests:
          - not_null
      - name: phase_level
        tests:
          - not_null
      - name: phase_code
        tests:
          - not_null
      - name: span_seq
        tests:
          - not_null
      - name: reason_exposure_days
        tests:
          - not_null

  - name: fct_inv_timing_allocation
    description: >
      Timing-leakage priority allocation by phase and bucket (slice 4, D46–D50).
      In scope for Version 6 timing-group primary causes only; payment vs
      pre-posting regime from runway_at_handoff (D89). Grain
      (sap_inv_key, phase_level, phase_code, bucket_code); rows only when
      priority_allocated_eur > 0.
    columns:
      - name: sap_inv_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_inv_sap')
                field: sap_inv_key
      - name: phase_level
        tests:
          - not_null
      - name: phase_code
        tests:
          - not_null
      - name: bucket_code
        tests:
          - not_null
      - name: priority_allocated_eur
        tests:
          - not_null
      - name: post_deadline_days
        description: Deadline-to-clearing days on the invoice; repeated on bucket rows (D48/D61).