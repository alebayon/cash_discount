version: 2

models:
  - name: mart_cash_discount_kpi
    description: >
      SAP cash-discount hero KPIs for the configured reporting period.
      One aggregate row sourced from fct_inv_sap funnel flags.
    columns:
      - name: reporting_period_start
        tests: [not_null]
      - name: reporting_period_end
        tests: [not_null]
      - name: leakage_eur
        description: Sum of lost_discount_amount on leakage rows.
        tests: [not_null]
      - name: leakage_rate
        description: leakage_eur / discount_opportunity_eur (KPI entitled universe).
      - name: kpi_entitled_count
        tests: [not_null]

  - name: mart_cash_discount_kpi_by_cause
    description: >
      Leakage KPI breakdown by Version 5 primary_cause.
      One row per cause per reporting period; leakage rows only.
    columns:
      - name: reporting_period_start
        tests: [not_null]
      - name: reporting_period_end
        tests: [not_null]
      - name: primary_cause
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - data_quality_error
                  - capture
                  - structural_terms_vs_capability
                  - structural_insufficient_time_at_intake
                  - structural_compressed_intake
                  - timing
      - name: primary_cause_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [capture, structural, timing, unclassified]
      - name: leakage_count
        tests: [not_null]
      - name: leakage_eur
        tests: [not_null]
  - name: mart_timing_phase_profile
    description: >
      Population timing profile by phase for the reporting period.
      Measured spans only; periodized on span_end_date. Ownership and subprocess
      phases. No benchmark comparison.
    columns:
      - name: reporting_period_start
        tests: [not_null]
      - name: reporting_period_end
        tests: [not_null]
      - name: phase_level
        tests: [not_null]
      - name: phase_code
        tests: [not_null]
      - name: span_count
        tests: [not_null]

  - name: mart_timing_phase_impact
    description: >
      Timing bucket report — phase page order (slice 4, D51). One row per
      reporting period x phase_level x phase_code; sorted by euros in SQL.
    columns:
      - name: reporting_period_start
        tests: [not_null]
      - name: reporting_period_end
        tests: [not_null]
      - name: phase_level
        tests: [not_null]
      - name: phase_code
        tests: [not_null]
      - name: invoice_count
        tests: [not_null]
      - name: priority_allocated_eur
        tests: [not_null]

  - name: mart_timing_bucket_impact
    description: >
      Timing bucket report — bucket drill-down with 75% ACT/WATCH and owner_role
      (slice 4, D51–D52).
    columns:
      - name: reporting_period_start
        tests: [not_null]
      - name: reporting_period_end
        tests: [not_null]
      - name: phase_level
        tests: [not_null]
      - name: phase_code
        tests: [not_null]
      - name: bucket_code
        tests: [not_null]
      - name: priority_allocated_eur
        tests: [not_null]
      - name: action_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACT', 'WATCH']
      - name: owner_role
        tests: [not_null]