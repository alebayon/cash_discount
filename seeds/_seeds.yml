seeds:
  - name: seed_payment_term_sap
    description: SAP ZTERM lookup for discount % and days.
    columns:
      - name: ZTERM
        tests:
          - unique
          - not_null
  - name: seed_attribution_policy
    description: >
      Versioned leakage attribution policy parameters (D83, D90).
      Active row drives int_attribution_policy_active and fct_inv_sap_cd V6 fields.
    columns:
      - name: attribution_policy_version
        description: Policy label echoed on invoice fact (e.g. v6).
        tests:
          - not_null
          - unique
      - name: minimum_processing_days
        description: Expedited minimum pre-SAP calendar days (V6 default 4).
        tests:
          - not_null
      - name: standard_processing_days
        description: Standard pre-SAP calendar days (V6 default 7).
        tests:
          - not_null
      - name: minimum_payment_runway_days
        description: Payment runway required at SAP handoff (V6 default 3).
        tests:
          - not_null
      - name: is_active
        description: Exactly one row must be true for production builds.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
  - name: raw_inv_coupa
    config:
      quote_columns: true
  - name: raw_vendor_coupa
    config:
      quote_columns: true
  - name: raw_inv_coupa_changes
    config:
      quote_columns: true
  - name: seed_coupa_status_map
    description: Coupa invoice status to timing role vocabulary (D21).

  - name: seed_timing_overlay_reason_map
    description: Five overlay blocker reason codes (D36).
    columns:
      - name: overlay_reason_code
        tests:
          - unique
          - not_null

  - name: raw_inv_sap_changes
    description: SAP CDHDR-style change events (phase 1 payment block hero).

  - name: seed_sap_payment_block_map
    description: ZLSPR value transitions to block set/release (D62).
    columns:
      - name: fname
        tests:
          - not_null
      - name: block_event_role
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['set', 'release']