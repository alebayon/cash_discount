seeds:
  - name: seed_payment_term_sap
    description: SAP ZTERM lookup for discount % and days.
    columns:
      - name: ZTERM
        tests:
          - unique
          - not_null
  - name: raw_inv_coupa
    config:
      quote_columns: true
  - name: raw_vendor_coupa
    config:
      quote_columns: true
  - name: raw_inv_coupa_changes
    config:
      quote_columns: true
  - name: seed_coupa_status_map
    description: Coupa invoice status to timing role vocabulary (D21).

  - name: seed_timing_overlay_reason_map
    description: Five overlay blocker reason codes (D36).
    columns:
      - name: overlay_reason_code
        tests:
          - unique
          - not_null