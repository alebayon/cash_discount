seeds:
  - name: seed_payment_term_sap
    description: SAP ZTERM lookup for discount % and days.
    columns:
      - name: ZTERM
        tests:
          - unique
          - not_null
  - name: seed_attribution_policy
    description: >
      Versioned leakage attribution policy parameters (D83, D90).
      Active row drives int_attribution_policy_active and fct_inv_sap_cd V6 fields.
    columns:
      - name: attribution_policy_version
        description: Policy label echoed on invoice fact (e.g. v6).
        tests:
          - not_null
          - unique
      - name: minimum_processing_days
        description: Expedited minimum pre-SAP calendar days (V6 default 4).
        tests:
          - not_null
      - name: standard_processing_days
        description: Standard pre-SAP calendar days (V6 default 7).
        tests:
          - not_null
      - name: minimum_payment_runway_days
        description: Payment runway required at SAP handoff (V6 default 3).
        tests:
          - not_null
      - name: is_active
        description: Exactly one row must be true for production builds.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: seed_cd_wco_arbitration_policy
    description: >
      Versioned CD/WCO arbitration thresholds (ap_core). v1: min potential discount EUR
      and max cash-acceleration days (discount deadline to net due). Policy row selected
      by invoice document_date. Consumed by arbitration model; fct_inv_sap_cd applies CD limits.
    config:
      tags:
        - core
    columns:
      - name: arbitration_policy_version
        description: Policy label echoed on arbitration output (e.g. v1).
        tests:
          - not_null
          - unique
      - name: effective_from
        description: Inclusive start; match document_date >= effective_from.
        tests:
          - not_null
      - name: effective_to
        description: Inclusive end; match document_date <= effective_to.
        tests:
          - not_null
      - name: minimum_potential_discount_eur
        description: CD target only if invoice_amount_eur * discount_pct >= this value.
        tests:
          - not_null
      - name: maximum_cash_acceleration_days
        description: CD target only if calendar days (discount_deadline to net_due) <= this value.
        tests:
          - not_null

  - name: raw_inv_coupa
    config:
      quote_columns: true
  - name: raw_vendor_coupa
    config:
      quote_columns: true
  - name: raw_inv_coupa_changes
    config:
      quote_columns: true
  - name: seed_coupa_status_map
    description: Coupa invoice status to timing role vocabulary (D21).

  - name: seed_timing_overlay_reason_map
    description: Five overlay blocker reason codes (D36).
    columns:
      - name: overlay_reason_code
        tests:
          - unique
          - not_null

  - name: raw_inv_sap_changes
    description: SAP CDHDR-style change events (phase 1 payment block hero).

  - name: seed_sap_payment_block_map
    description: ZLSPR value transitions to block set/release (D62).
    columns:
      - name: fname
        tests:
          - not_null
      - name: block_event_role
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['set', 'release']